<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPV PAWtrol</title>
    
    <link rel="stylesheet" href="css/style.css">    
</head>
<body>
    <div id="navbar"></div>

    <div class="page-message">
        <div class="form-error" id="id-form-error"></div>
    </div>
    
    <div class="login-container">
        <h1>UPV PAWtrol</h1>
        <p>Login to your account</p>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" name= "email" id="email" placeholder="Enter your email" autocomplete="email" required>
            <small class="error" id="email-error"></small>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" name="password" id="password" placeholder="Enter password" required>
                <span class="toggle-password" onclick="togglePassword()">Show</span>
            </div>
            <small class="error" id="password-error"></small>

            <div class="form-error" id="form-error"></div>
            <button type="submit" >Login</button>
        </form>

        <div class="signup">
            Don’t have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
    <div id="footer"></div>

    <script src="js/navbar.js"></script>
    <script src="js/pass-toggle.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
